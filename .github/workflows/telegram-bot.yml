name: Elian Telegram Bot

on:
  workflow_dispatch:

concurrency:
  group: elian-telegram-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  telegram-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install agent dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Verify agent
        run: |
          pwd
          test -f agent.py
          test -f autonomous_agent.py
          python -m py_compile agent.py
          python -m py_compile autonomous_agent.py
          echo "agent.py syntax: OK"
          echo "autonomous_agent.py syntax: OK"

      - name: Verify Telegram API
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          test -n "$TELEGRAM_TOKEN"
          curl -fsS -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/getMe"
          echo

      - name: Start Autonomous Telegram Agent
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_FULL_ACCESS: "1"
          AGENT_MODE: poll
          PYTHONIOENCODING: utf-8
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: python autonomous_agent.py

      - name: Save memory and task state
        if: always()
        run: |
          git config user.email "agent@github.com"
          git config user.name "AI Agent"
          git add memory.json tasks.json .model_cooldown.json task_state.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "agent state update [skip ci]"
          git pull --rebase --autostash 2>/dev/null || true
          git push 2>/dev/null || true